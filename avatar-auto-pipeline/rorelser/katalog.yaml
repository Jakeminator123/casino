# Rörelsekatalog för 3D-dealern.
# Källa för vad som ska finnas. status: forslag | utkast | klar.
# seat: 1–7 (spelarplatser, dealerns vänster → höger sett från kameran framifrån)
#       eller tom när rörelsen inte hör till en plats.
# langd_s är mål; kurvorna skapas i 24 fps.

version: 1
avatar: null   # fylls i när en dealer eller standarddockan finns i output/
docka: null    # t.ex. output/<namn>/06-dealer-export/<namn>-dealer-apose.glb
scen: null     # t.ex. output/<namn>/08-film/<namn>-med-bord.blend
fps: 24


rorelser:
  - id: vila
    namn: Vila
    langd_s: 4
    seat: null
    beskrivning: Sittande vilopose med lätt andning, händerna i redo nära skon eller bordskanten.
    status: utkast
    anteckning: Del av den befintliga sittande gesten i steg/08-film/animera_dealer.py, inte utbruten som egen Action än.

  - id: andas
    namn: Andning
    langd_s: 3
    seat: null
    beskrivning: Tydligare andningscykel i bröst och axlar, utan armgest.
    status: forslag

  - id: nicka
    namn: Nicka
    langd_s: 2
    seat: null
    beskrivning: Kort jakande nick, blicken tillbaka till bordet.
    status: forslag

  - id: skaka-huvud
    namn: Skaka på huvudet
    langd_s: 2
    seat: null
    beskrivning: Milt nej, lämpligt vid bust eller felaktig gest från spelaren.
    status: forslag

  - id: le
    namn: Le
    langd_s: 3
    seat: null
    beskrivning: Kort leende i vila. Utan blendshapes blir det mest kind/huvudhållning tills ansiktsformer finns.
    status: forslag

  - id: titta-pa-skon
    namn: Titta på skon
    langd_s: 3
    seat: null
    beskrivning: Blicken och en lätt lutning ner mot kortskon.
    status: forslag

  - id: titta-spelare-1
    namn: Titta på spelare 1
    langd_s: 2
    seat: 1
    beskrivning: Vridning av huvud och blick mot seat 1.
    status: forslag
  - id: titta-spelare-2
    namn: Titta på spelare 2
    langd_s: 2
    seat: 2
    beskrivning: Vridning av huvud och blick mot seat 2.
    status: forslag
  - id: titta-spelare-3
    namn: Titta på spelare 3
    langd_s: 2
    seat: 3
    beskrivning: Vridning av huvud och blick mot seat 3.
    status: forslag
  - id: titta-spelare-4
    namn: Titta på spelare 4
    langd_s: 2
    seat: 4
    beskrivning: Vridning av huvud och blick mot seat 4 (rakt fram).
    status: forslag
  - id: titta-spelare-5
    namn: Titta på spelare 5
    langd_s: 2
    seat: 5
    beskrivning: Vridning av huvud och blick mot seat 5.
    status: forslag
  - id: titta-spelare-6
    namn: Titta på spelare 6
    langd_s: 2
    seat: 6
    beskrivning: Vridning av huvud och blick mot seat 6.
    status: forslag
  - id: titta-spelare-7
    namn: Titta på spelare 7
    langd_s: 2
    seat: 7
    beskrivning: Vridning av huvud och blick mot seat 7.
    status: forslag

  - id: giv-spelare-1
    namn: Giv till spelare 1
    langd_s: 8
    seat: 1
    beskrivning: Ett kort från skon till seat 1 och återgång till vila. Mål ca 1,3 s ut och 0,8 s tillbaka, plus för- och eftervila så klippet blir 6–10 s.
    status: forslag
  - id: giv-spelare-2
    namn: Giv till spelare 2
    langd_s: 8
    seat: 2
    beskrivning: Ett kort från skon till seat 2 och återgång till vila.
    status: forslag
  - id: giv-spelare-3
    namn: Giv till spelare 3
    langd_s: 8
    seat: 3
    beskrivning: Ett kort från skon till seat 3 och återgång till vila.
    status: forslag
  - id: giv-spelare-4
    namn: Giv till spelare 4
    langd_s: 8
    seat: 4
    beskrivning: Ett kort från skon till seat 4 och återgång till vila.
    status: forslag
  - id: giv-spelare-5
    namn: Giv till spelare 5
    langd_s: 8
    seat: 5
    beskrivning: Ett kort från skon till seat 5 och återgång till vila. Typexemplet för katalogen.
    status: forslag
  - id: giv-spelare-6
    namn: Giv till spelare 6
    langd_s: 8
    seat: 6
    beskrivning: Ett kort från skon till seat 6 och återgång till vila.
    status: forslag
  - id: giv-spelare-7
    namn: Giv till spelare 7
    langd_s: 8
    seat: 7
    beskrivning: Ett kort från skon till seat 7 och återgång till vila.
    status: forslag

  - id: giv-dealer-c1
    namn: Giv dealerns första kort
    langd_s: 6
    seat: null
    beskrivning: Kort till dealerns ruta, uppåt eller enligt husets regel för C1.
    status: forslag
  - id: giv-dealer-c2
    namn: Giv dealerns andra kort
    langd_s: 6
    seat: null
    beskrivning: Andra kortet till dealern.
    status: forslag
  - id: vanda-halkort
    namn: Vänd hålkortet
    langd_s: 5
    seat: null
    beskrivning: Vändning med handleden, inte bara fingrarna, så att hålkortet kommer upp.
    status: forslag
  - id: atergang-vila
    namn: Återgång till vila
    langd_s: 3
    seat: null
    beskrivning: Från redo/giv tillbaka till viloposen, händerna landar lugnt.
    status: forslag

  - id: peka-kort
    namn: Peka på kort
    langd_s: 3
    seat: null
    beskrivning: En hand pekar eller sveper mot ett kort på bordet.
    status: forslag
  - id: bjuda-insats
    namn: Bjuda in insats
    langd_s: 4
    seat: null
    beskrivning: Öppen inbjudande gest mot bordet innan ny runda.
    status: forslag
  - id: inga-fler-kort
    namn: Inga fler kort
    langd_s: 3
    seat: null
    beskrivning: Tydlig "klar/stand"-gest, handen vågrätt över bordet.
    status: forslag
  - id: samla-kort
    namn: Samla korten
    langd_s: 8
    seat: null
    beskrivning: Svep in korten från platserna mot dealern. Kan senare delas per sida.
    status: forslag
  - id: betala-vinst
    namn: Betala vinst
    langd_s: 6
    seat: 5
    beskrivning: Skjuta marker mot en plats (förvald seat 5 som typfall).
    status: forslag
  - id: ta-insats
    namn: Ta insats
    langd_s: 5
    seat: 5
    beskrivning: Dra in marker från en plats.
    status: forslag
  - id: flytta-bricka
    namn: Flytta brickan
    langd_s: 4
    seat: null
    beskrivning: Liten justering av kort- eller markerbrickan.
    status: forslag

  - id: satta-sig
    namn: Sätta sig
    langd_s: 6
    seat: null
    beskrivning: Från stående till sittande bakom bordet.
    status: forslag
  - id: resa-sig
    namn: Resa sig
    langd_s: 6
    seat: null
    beskrivning: Från sittande till stående.
    status: forslag
  - id: ingang
    namn: Ingång
    langd_s: 10
    seat: null
    beskrivning: Kom in, hälsa, sätt sig. Kan delas i två klipp.
    status: forslag
  - id: utgang
    namn: Utgång
    langd_s: 8
    seat: null
    beskrivning: Resa sig, kort nick, gå ut.
    status: forslag
  - id: luta-mot-1-2
    namn: Luta mot plats 1–2
    langd_s: 4
    seat: 1
    beskrivning: Kroppen lutar mot de vänstra platserna, som i blackjack-dealer-önskemålet.
    status: forslag
  - id: luta-mot-6-7
    namn: Luta mot plats 6–7
    langd_s: 4
    seat: 7
    beskrivning: Spegel mot de högra platserna.
    status: forslag
  - id: redo-nyp
    namn: Redo med nyp
    langd_s: 3
    seat: null
    beskrivning: Övergång till nyp-hållning (ankare 2.1-känsla) med kort mellan fingrarna.
    status: forslag
  - id: redo-skjut
    namn: Redo att skjuta kort
    langd_s: 3
    seat: null
    beskrivning: Båda händerna vid skon, redo att skjuta (ankare 2.3-känsla).
    status: forslag
  - id: byta-sko
    namn: Byt eller justera skon
    langd_s: 6
    seat: null
    beskrivning: Lyft eller justera kortskon, fortfarande sittande.
    status: forslag
