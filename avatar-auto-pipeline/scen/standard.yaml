# STANDARD – en enda sanning för bord, platser, sko, kort, dockor och kameror: livebordet, mätt på film.
# Skriven av scen/gen_standard.py ur spelets egen kod (casino/blackjack-dealer, som scen/las_spelet.ts läser).
# Ändra aldrig för hand: ändra i spelet eller i gen_standard.py och kör python scen/gen_standard.py.
# Varje värde har sin källa eller "antaget" med motivering. Spelet vinner över allt annat.
# mätt = mätt på filmen; skattat = mätt men svagt; slutlett = härlett ur andra mått, inte sett; antaget = vårt, tills det mäts.
#
# KOORDINATER (Blender, Z upp, meter, högerhänt):
#   origo  = golvet rakt under dealerkantens mitt (LIVE.edge)
#   +X     = dealerns vänster = bildens höger sett från spelarna/filmkameran (samma x som spelets linsvärld)
#   +Y     = bakåt, från spelarna mot dealerns rygg (spelarna står på -Y). Blenders "Front"-vy (från -Y) ser alltså dealern framifrån
#   +Z     = upp; filten ligger på Z = filt_z
#   Omräkning från livebordets linsvärld (three.js, y upp, kameran i (0, h, 0) tittar mot -z):
#     X = x,  Y = -(z - dealerkant_lins_z) = -(z + 1.5375),  Z = y + filt_z
#   Vinkel "yaw" = grader moturs sett ovanifrån, 0 = längs +X.

enhet: m
format_version: 2
filt_z: 0.9500  # slutlett, inte mätt (golvet syns aldrig): ur dealrarnas ögon när de står, ±0.1 m; blackjack-dealer/src/table-live.ts LIVE.floor

lins:  # livebordets kamera, mätt ur 29 kort på filten (0,54 bildpunkter per hörn); ärlig osäkerhet 5 % på brännvidden, 2-3 cm på höjden, 0,3 grader på lutningen. källa: blackjack-dealer/src/table-live.ts LIVE.camera, liveFrame()
  focal_px: 1290.3
  bild_px: [1728, 972]
  mitt_px: [863.5, 485.5]  # där den optiska axeln möter bilden (bildens mitt)
  pitch_rad: 0.3164281934  # = 18.130 grader nedåt
  rull_rad: -0.0027925268  # = -0.160 grader: en vågrät linje på filten faller åt höger i bilden
  hojd_over_filt: 0.6175
  dealerkant_lins_z: -1.5375  # mätt: dealerkantens z i livebordets linsvärld (LIVE.edge), för omräkningen i huvudet
  sensor_mm: 36.0  # antaget: Blender-standard, sensor_fit HORIZONTAL; brännvidden nedan räknas om så att bilden blir exakt kamerans
  brannvidd_mm: 26.8812  # härlett: focal_px / bild_bredd * sensor_mm
  pos: [0.0000, -1.5375, 1.5675]
  fram: [0.000000, 0.950353, -0.311174]  # kamerans riktning
  hoger: [0.999996, 0.000869, 0.002654]  # bildens höger (med rullningen)
  upp: [-0.002793, 0.311173, 0.950349]  # bildens upp (med rullningen)

bord:  # mätt: en halvcirkel med rak kant mot dealern (bågen en cirkel inom 1,8 mm över 1234 punkter); sarg, ben, färger och texturer är vårt utseende. källa: blackjack-dealer/src/table-live.ts LIVE.felt, LIVE.rail
  typ: halvcirkel
  mitt: [0.0020, 0.0156]  # bågens mitt, 1.56 cm bakom kanten
  radie: 0.7295
  halv_bredd_vid_kanten: 0.7293  # härlett
  bredd: 1.4587  # härlett: filtens bredd längs dealerkanten
  djup: 0.714
  kontur_bagsteg: 180  # antaget: bågens täthet
  vadderad_kant:  # antaget (vår): läderrullen utanför bågen, så att filten som syns är den mätta. källa: LIVE.rail
    bredd: 0.1
    mitt_over_filt: 0.012  # LIVE.rail.section.lift
    halv_hojd: 0.034  # LIVE.rail.section.above
  sarg:  # antaget (vår): valnötssarg under rullens överhäng, höjder relativt filten
    underkant: -0.16
    massingslinje: [-0.002, 0.005]  # mässingslist mot filten, ~2 mm över
    underlagg: -0.008  # underläggets tjocklek, så att filten ligger an
  ben:  # antaget (vårt): två ben (x = ±x, s mot spelarna, Y = -s)
    x: 0.58
    s: 0.25
    radie_topp: 0.07
    radie_fot: 0.09
    platta_radie: 0.10  # mässingsfot
    platta_hojd: 0.015
  filtfarg_srgb: "#134232"  # antaget (vår): spelets gröna filt
  markeringsfarg_srgb: "#d8b665"  # antaget (vår): kortplatsernas och ringarnas guld
  texturer_skala_m:
    filt: [0.40, 0.40]  # antaget: filten upprepas på ca 40 cm
    tra: [1.8, 1.8]  # valnötsfaner (Poly Haven)
    lader: [0.4, 0.4]  # brunt läder

kort:
  bredd: 0.063  # källa: blackjack-dealer/src/space.ts (CARD)
  langd: 0.088  # källa: blackjack-dealer/src/space.ts (CARD)
  tjocklek: 0.0003  # källa: blackjack-dealer/src/space.ts (CARD)
  hornradie: 0.0035  # källa: blackjack-dealer/src/space.ts (CARD)
  lekar_i_skon: 8  # antaget: vanlig kasinosko 6–8 lekar
  markering:  # kortplatsernas guldram på filten
    marginal: 0.004  # antaget: 4 mm runt kortet så kortet syns inne i ramen
    linjebredd: 0.003  # antaget: tunn tryckt linje

platser:  # mätt: där korten först låg stilla, kortets mitt; yaw_kort = långsidans vridning i grader moturs uppifrån (0 = rakt mot spelaren). källa: blackjack-dealer/src/table-live.ts LIVE.cards
  # vinkel: mätt där landningarna är eniga om den, annars spegelbilden av samma kort på den speglade platsen (LIVE.cards[id].turnFrom)
  # platserna räknas ännu från bildens vänster: P1 längst till vänster i bilden (dealerns höger), P7 närmast skon
  D.C1: {pos: [-0.0272, -0.1774, 0.9500], yaw_kort: 4.80, landningar: 18, vinkel: "mätt"}
  D.C2: {pos: [0.0243, -0.1928, 0.9500], yaw_kort: -2.30, landningar: 18, vinkel: "mätt"}
  D.C3: {pos: [-0.0269, -0.1808, 0.9500], yaw_kort: 3.50, landningar: 11, vinkel: "mätt"}
  P1.C1: {pos: [-0.4206, -0.3190, 0.9500], yaw_kort: -51.30, landningar: 6, vinkel: "spegel av P7.C1"}
  P1.C2: {pos: [-0.3732, -0.3218, 0.9500], yaw_kort: -44.00, landningar: 5, vinkel: "mätt"}
  P1.C3: {pos: [-0.3701, -0.3210, 0.9500], yaw_kort: -55.10, landningar: 3, vinkel: "spegel av P7.C3"}
  P2.C1: {pos: [-0.2964, -0.4103, 0.9500], yaw_kort: -30.00, landningar: 3, vinkel: "spegel av P6.C1"}
  P2.C2: {pos: [-0.2987, -0.4204, 0.9500], yaw_kort: -30.10, landningar: 2, vinkel: "spegel av P6.C2"}
  P3.C1: {pos: [-0.0938, -0.4401, 0.9500], yaw_kort: -13.90, landningar: 3, vinkel: "spegel av P5.C1"}
  P4.C1: {pos: [0.0155, -0.5124, 0.9500], yaw_kort: -2.30, landningar: 11, vinkel: "mätt"}
  P4.C2: {pos: [0.0440, -0.4727, 0.9500], yaw_kort: -1.00, landningar: 9, vinkel: "mätt"}
  P5.C1: {pos: [0.1575, -0.4973, 0.9500], yaw_kort: 13.90, landningar: 6, vinkel: "mätt"}
  P5.C2: {pos: [0.1804, -0.4536, 0.9500], yaw_kort: 12.40, landningar: 4, vinkel: "mätt"}
  P6.C1: {pos: [0.2922, -0.4331, 0.9500], yaw_kort: 30.00, landningar: 14, vinkel: "mätt"}
  P6.C2: {pos: [0.2974, -0.3866, 0.9500], yaw_kort: 30.10, landningar: 11, vinkel: "mätt"}
  P6.C3: {pos: [0.2949, -0.3773, 0.9500], yaw_kort: 30.00, landningar: 3, vinkel: "som P6.C1"}
  P7.C1: {pos: [0.4265, -0.3069, 0.9500], yaw_kort: 51.30, landningar: 14, vinkel: "mätt"}
  P7.C2: {pos: [0.4156, -0.2613, 0.9500], yaw_kort: 44.00, landningar: 11, vinkel: "spegel av P1.C2"}
  P7.C3: {pos: [0.4612, -0.2636, 0.9500], yaw_kort: 55.10, landningar: 5, vinkel: "mätt"}

bet_ringar:  # våra insatsringar kring livebordets insatsmärken. källa: blackjack-dealer/src/standard.ts (BET)
  radie: 0.027
  linjebredd: 0.003  # antaget: samma tryckbredd som kortmarkeringen
  platser:  # mätt: mitten av spelets platsknappar, plats 1 till vänster i bilden (dealerns höger). källa: blackjack-dealer/src/table-live.ts LIVE.betMarks
    P1: [-0.4967, -0.4040, 0.9500]
    P2: [-0.3347, -0.5397, 0.9500]
    P3: [-0.1711, -0.6096, 0.9500]
    P4: [0.0004, -0.6301, 0.9500]
    P5: [0.1730, -0.6080, 0.9500]
    P6: [0.3363, -0.5362, 0.9500]
    P7: [0.4991, -0.3983, 0.9500]

sko:  # en lång genomskinlig låda, öppen upptill: fronten är en klar ram som lutar bakåt från fotens två främre hörn, med ett fönster där nästa kort syns; kortleken ligger på en bädd som stiger bakåt, varje kort lutat som fronten med långsidan tvärs skon. källa: blackjack-dealer/src/table-live.ts LIVE.shoe, liveShoePose(), liveShoeCard()
  genomskinlig: true
  fot_fram: [0.4521, -0.1531, 0.9500]  # mätt: fotens främre hörn mot spelarna (hörnen lästa för ögat, 1-2 cm)
  fot_horn: [[0.4270, -0.0533, 0.9500], [0.4521, -0.1531, 0.9500], [0.7162, -0.0798, 0.9500]]  # mätt: främre vid dealern, främre mot spelarna, bakre mot spelarna
  yaw_bakat: 15.512  # härlett ur foten: bakänden vriden mot dealern
  langd: 0.274  # mätt (foten)
  bredd: 0.103  # mätt (foten)
  hojd_bak: 0.117  # mätt ur bilden; väggarnas överkant går rakt från frontens topp hit
  hojd_fram: 0.061  # mätt: frontens topp (de två topphörnen lästa 0,060 och 0,062)
  platta_lutning_grader: 56.60  # mätt: från filten (topphörnen lästa 34,0 och 32,8 grader bakåt från lodrätt; kortets rygg i fönstret lutar lika)
  fonster_lyft: 0.003  # mätt: där bädden börjar framtill, kortets underkant över filten
  badd_lutning_grader: 13.40  # mätt: bädden stiger bakåt, sedd genom den nära väggen
  lek_langd: 0.18  # skattat: hur långt längs bädden kortleken når (0,14 m vid 62 s, 0,23 m vid 600 s i filmen; 0,18 är åtta lekar)
  front_horn: [[0.4270, -0.0533, 0.9500], [0.4521, -0.1531, 0.9500], [0.4907, -0.1434, 1.0117], [0.4663, -0.0434, 1.0101]]  # mätt: fot vid dealern, fot mot spelarna, topp mot spelarna, topp vid dealern
  fonsterkort_mitt: [0.4577, -0.0981, 0.9787]  # nästa kort i frontens fönster, ryggen utåt; inom 2 mm från mätningens mitt
  fonsterkort_langsida: [-0.2674, 0.9636, 0.0000]  # kortets långsida, tvärs skon (mot den bortre väggen)
  fonsterkort_kortsida: [0.5304, 0.1472, 0.8348]  # kortets kortsida, uppför fronten
los_bit: {horn: [[0.3652, -0.0915, 0.9500], [0.4017, -0.0757, 0.9500], [0.4311, -0.1701, 0.9500], [0.3977, -0.1786, 0.9500]], mitt: [0.3989, -0.1290, 0.9500]}  # mätt: en lös klar bit som ligger plant på filten strax framför skon; kortet som dras ut glider över den. källa: LIVE.clearPiece

kassering:  # mätt: en klar låda vid dealerns högra hörn, öppen upptill; de använda korten ligger plant i den, ryggen upp. källa: LIVE.box, liveBox()
  fot_mitt: [-0.6115, -0.0351, 0.9500]
  yaw: 2.143
  yttermatt: [0.076, 0.093, 0.1575]  # foten mätt; höjden mätt ur bilden (0,156-0,159)
  vaggtjocklek: 0.004  # antaget: 4 mm akryl
  kort_hog: 0.03  # skattat: de använda kortens hög, liggande med ryggen upp (2-5 cm genom filmen)
skarkort: {mitt: [-0.5737, -0.1333, 0.9500], storlek: [0.0479, 0.0863]}  # mätt, men ligger bara ute ibland: byggs inte

markerbricka:  # mätt: livebordet har ingen (markerna är spelets grafik). Det här är vår, ett tillägg som bara bygg_bord.py --med-bricka lägger in vid dealerkanten
  x0: -0.3  # antaget (vår): metrar tvärs bordet (X)
  x1: 0.24
  s0: 0  # från dealerkanten mot spelarna (Y = -s)
  s1: 0.1
  djup: 0.03
  kant_bredd: 0.007  # källa: blackjack-dealer/src/game3d-tray.ts (rim = 0.007 m mässingslist i filtnivå)
  ror: 12  # källa: blackjack-dealer/src/game3d-tray.ts (TRAY_ROWS har 12 rader)
  urtag: {x0: -0.3, x1: 0.24, s1: 0.1}  # exakt brickans ytterkant (mässingsram täcker skarven)
  chip_radie: 0.0195  # källa: blackjack-dealer/src/game3d-chips.ts (CHIP_RADIUS, CHIP_HEIGHT)
  chip_hojd: 0.003145  # källa: blackjack-dealer/src/game3d-chips.ts (CHIP_RADIUS, CHIP_HEIGHT)
  fyllnad_start: 20  # källa: blackjack-dealer/src/game3d-tray.ts TRAY_FILL.start
  rad_valorer: [5, 5, 25, 25, 100, 100, 500, 1000, 500, 100, 25, 5]  # källa: blackjack-dealer/src/game3d-tray.ts

