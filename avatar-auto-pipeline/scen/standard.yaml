# STANDARD – en enda sanning för bord, platser, sko, kort, docka och kameror.
# Skriven av scen/gen_standard.py ur spelets egen kod (casino/blackjack-dealer, som scen/las_spelet.ts läser).
# Ändra aldrig för hand: ändra i spelet eller i gen_standard.py och kör python scen/gen_standard.py.
# Varje värde har "# källa: fil (namn)" eller "# antaget: motivering". Spelet vinner över allt annat.
#
# KOORDINATER (Blender, Z upp, meter, högerhänt):
#   origo  = golvet rakt under dealerkantens mitt (dealerEdge i dealer3d, s = 0; gäller både standardovalen och BORD-02:s urtag)
#   +X     = dealerns vänster = bildens höger sett från spelarna/filmkameran (samma x som spelets lins-värld)
#   +Y     = bakåt, från spelarna mot dealerns rygg (spelarna står på -Y). Blenders "Front"-vy (från -Y) ser alltså dealern framifrån
#   +Z     = upp; filten ligger på Z = filt_z
#   Omräkning från spelets lins-värld (three.js, y upp, filmkameran i (0, h, 0) tittar mot -z):
#     X = x,  Y = -(z - dealerEdge.z) = -(z + 1.843773),  Z = y + filt_z
#   Bordets egna (x, s) (samma för standardovalen och BORD-02): X = x, Y = -s.  Vinkel "yaw" = grader moturs sett ovanifrån, 0 = längs +X.

enhet: m
format_version: 1
filt_z: 0.9500  # källa: blackjack-dealer/src/scene3d-table.ts (BASE.floor) – scenens golv ligger 0,95 m under filten (BORD-02-källans 75 cm används inte, se avvikelser)

lins:  # filmkamerans lins; hela spelets värld är räknad ur den
  focal_px: 2334  # källa: blackjack-dealer/src/table-lens.ts (TABLE_LENS)
  pitch_rad: 0.4373194932  # källa: blackjack-dealer/src/table-lens.ts (TABLE_LENS) (= 25.057 grader nedåt)
  hojd_over_filt: 1.1099955533  # källa: blackjack-dealer/src/table-lens.ts (TABLE_LENS)
  bild_px: [1764, 1174]  # källa: blackjack-dealer/src/table-lens.ts (FILM)
  dealerkant_lins_z: -1.8437725961  # källa: blackjack-dealer/dealer3d/src/world.ts dealerEdge(TABLE_LENS) – dealerkantens z i spelets lins-värld (för omräkning, se huvudet)
  sensor_mm: 36.0  # antaget: Blender-standard, sensor_fit HORIZONTAL; brännvidden nedan räknas om så att bilden blir exakt spelets
  brannvidd_mm: 47.6327  # härlett: focal_px / bild_bredd * sensor_mm

spelvy:  # spelets vy (Jakob 2026-11-26): kameran standarddockan filmas genom och spelets bord ritas genom för de filmerna; samma lins och plats över bordet som filmkameran, men lägre och flackare
  focal_px: 2334  # källa: blackjack-dealer/src/table-lens.ts (PLAY_LENS)
  pitch_rad: 0.2094395102  # källa: blackjack-dealer/src/table-lens.ts (PLAY_LENS) (= 12.000 grader nedåt)
  hojd_over_filt: 0.5800000000  # källa: blackjack-dealer/src/table-lens.ts (PLAY_LENS)

bord_modell: standard  # källa: blackjack-dealer/src/scene3d-view.ts DEFAULTS.tableModel
bord:  # spelets standardbord (oval halv-ellips, rak dealerkant). källa: blackjack-dealer/src/scene3d-table.ts (TABLE, REAL_TABLE) under linsen (tableUnder: bredd TABLE.a*2, djup REAL_TABLE.depth)
  typ: oval_halvellis
  bredd: 1.9000  # källa: blackjack-dealer/src/scene3d-table.ts (TABLE, REAL_TABLE) TABLE.a * 2
  djup: 1.1500  # källa: blackjack-dealer/src/scene3d-table.ts (TABLE, REAL_TABLE) REAL_TABLE.depth (TABLE.b = 0,60 m är kontraktets kortare bord; under filmlinsen används 1,15 m)
  halv_bredd: 0.95  # källa: blackjack-dealer/src/scene3d-table.ts (TABLE, REAL_TABLE) TABLE.a
  radie: 0.95  # alias för halv_bredd (samma nyckel som QC-överlägget använder)
  axel_s: 0.0  # rak dealerkant börjar vid s = 0 (inga vingar)
  fram_s: 1.1500  # spelarkanten mitt fram (Y = -1.1500)
  bak_s: 0.0  # rak dealerkant vid s = 0 (Y = 0); inga vingar bakåt
  kontur_bagsteg: 180  # antaget: samma täthet som BORD-02-bågen
  vadderad_kant:  # läderrulle längs spelarbågen (inte längs dealerkanten)
    bredd: 0.1  # källa: blackjack-dealer/src/scene3d-table.ts (TABLE, REAL_TABLE) TABLE.rail (~10 cm, RAIL.centre 0,057 + 5 cm halvsektion)
    mitt_over_filt: 0.012  # källa: blackjack-dealer/src/scene3d-table.ts CORE[1]
    halv_hojd: 0.034  # källa: blackjack-dealer/src/scene3d-table.ts RAIL.top - CORE[1]
    som_in: 0.0  # antaget: standardbordets sömmar är en del av rullens sektion, inte ett separat mått
    som_hojd: 0.0
    andradie: 0.05  # antaget: rullens ändar vid dealerkanten
  sarg:  # valnötssarg under rullens överhäng, höjder relativt filten
    underkant: -0.16  # källa: kommentar i scene3d-table.ts (lackad valnötssarg under rullen); BASE.under = -0.15
    massingslinje: [-0.002, 0.005]  # källa: scene3d-table.ts BEAD (mässingslist mot filten, ~2 mm över)
    underlagg: -0.008  # antaget: samma underläggstjocklek som BORD-02, för att filten ska ligga an
  ben:  # två ben (x = ±x, s mot spelarna). källa: blackjack-dealer/src/scene3d-table.ts (BASE)
    x: 0.58  # källa: BASE.legX
    s: 0.25  # källa: BASE.legZ (s mot spelarna, Y = -0.25)
    radie_topp: 0.07  # antaget: standardbordets ben är fotograferat trä, typisk topp
    radie_fot: 0.09  # antaget
    platta_radie: 0.10  # antaget: mässingsfot
    platta_hojd: 0.015  # antaget
  hylla_bakom_dealerkant:  # källa: scene3d-table.ts SHELF, avstängd som standard (labb 2026-11-13)
    djup_bakat: 0.40
    inre_x: 0.27
    tjocklek: 0.035
    pa_som_standard: false
  filtfarg_srgb: "#134232"  # källa: blackjack-dealer/src/scene3d-table.ts FELTS.green[0]
  markeringsfarg_srgb: "#d8b665"  # källa: blackjack-dealer/src/scene3d-table.ts (GOLD)
  texturer_skala_m:
    filt: [0.40, 0.40]  # antaget: standardfilten (V6/runway-tyger) upprepas på ca 40 cm; BORD-02:s scuba_suede var 0,285 m
    tra: [1.8, 1.8]  # samma valnötsfaner som BORD-02 (Poly Haven)
    lader: [0.4, 0.4]  # samma bruna läder som BORD-02
  dockans_forenklade_bord:  # det Kortplan visar sedan 9e440db. källa: dealer3d/src/stage.ts
    typ: halvcirkel
    radie: 1.02  # feltens radie; bredd 2,04 m, djup 1,02 m, rak dealerkant
    rulle_bredd: 0.12
    golv_under_filt: 0.90  # stage.ts floor.position.y = -0.9

