<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ljud · Studio</title>
<link rel="stylesheet" href="sound.css">
</head>
<body data-page="ljud-labb">
<div id="app">
  <div id="stage"><canvas id="view"></canvas><div id="hud"></div><p id="hint">Tryck på ett ljud till höger.<br>Ljudet börjar med första trycket (webbläsarens regel).</p><div id="fail" role="alert"></div></div>
  <aside id="panel">
    <p class="sub"><a href="/studio/" style="color:inherit">← Studion</a></p>
    <h1>Ljud</h1>
    <p class="note start" id="start-note" hidden></p>
    <fieldset><legend>Marker</legend>
      <div class="sounds" id="chips"></div>
      <label class="row">Styrka<input type="range" id="strength" min="5" max="100" step="1"><output id="strength-out"></output></label>
      <label class="row">Höjd på stapeln<input type="range" id="height" min="0" max="20" step="1"><output id="height-out"></output></label>
      <label class="row">Plats på bordet<input type="range" id="pan" min="-100" max="100" step="5"><output id="pan-out"></output></label>
    </fieldset>
    <fieldset><legend>Kort</legend>
      <div class="sounds" id="cards"></div>
    </fieldset>
    <fieldset><legend>Bakgrund</legend>
      <div class="seg three" id="rooms"></div>
      <p class="note" id="room-note"></p>
    </fieldset>
    <fieldset><legend>Musik</legend>
      <div class="seg three" id="tracks"></div>
      <p class="note" id="track-note"></p>
      <label class="row">Musik<input type="range" id="music" min="0" max="100" step="1"><output id="music-out"></output></label>
    </fieldset>
    <fieldset><legend>Volym</legend>
      <label class="row">Allt<input type="range" id="volume" min="0" max="100" step="1"><output id="volume-out"></output></label>
      <label class="row">Effekter<input type="range" id="effects" min="0" max="100" step="1"><output id="effects-out"></output></label>
      <label class="row">Bakgrund<input type="range" id="ambience" min="0" max="100" step="1"><output id="ambience-out"></output></label>
      <div class="meter" title="Nivån ut till högtalarna. Strecket står vid −6 dBFS, taket för ett enskilt ljud."><span>Nivå, dBFS</span><div class="bar"><i id="meter-fill"></i><b id="meter-hold"></b><u></u></div><output id="meter-out">–</output></div>
      <div class="btns"><button type="button" id="mute" aria-pressed="false">Stäng av ljudet</button></div>
    </fieldset>
  </aside>
</div>
<script type="module" src="preview-ui.js"></script>
<script type="module" src="sound.js" onerror="document.getElementById('fail').textContent='Sidans kod kunde inte läsas (sound.js). Starta servern med npm start och ladda om.'"></script>
</body>
</html>
